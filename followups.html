<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>핵심 인재 6개월 접촉 점검</title>
<style>
:root{font:15px/1.55 system-ui,"Malgun Gothic",sans-serif;color:#1b2d47;background:#f5f8fc}*{box-sizing:border-box}
body{margin:0}header{background:#fff;border-bottom:1px solid #dfe7f2;padding:18px max(20px,calc((100vw - 1200px)/2));display:flex;align-items:center;gap:18px}
a{color:#285e9d;text-decoration:none}main{max-width:1200px;margin:auto;padding:24px 20px}
h1{font-size:23px;margin:0}h2{font-size:17px;margin:0}p{color:#60728b}button,input,textarea{font:inherit}
button{cursor:pointer;border:1px solid #d3dfed;border-radius:9px;padding:9px 13px;background:white;color:#26598e}
button.primary{background:#205595;border-color:#205595;color:white}
button:disabled{opacity:.55;cursor:not-allowed}
.panel{border:1px solid #dbe5f1;background:white;border-radius:16px;padding:19px;margin-top:16px}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #e2eaf3;border-radius:12px;padding:14px;margin-top:12px}
.sub{font-size:12px;color:#70839b}.status{font-size:12px;border-radius:30px;padding:4px 10px;background:#e9f1fa;color:#326194}
dialog{border:0;border-radius:17px;padding:0;width:min(650px,calc(100vw - 24px));max-height:92vh;box-shadow:0 14px 65px #102c4d40}
dialog::backdrop{background:#0b1d37a8}
.dialog-content{padding:22px}label{display:block;font-size:13px;color:#526885;font-weight:650;margin-top:14px}
input,textarea{width:100%;padding:11px;margin-top:5px;border-radius:9px;border:1px solid #d6e1ef}
textarea{resize:vertical;min-height:190px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px;flex-wrap:wrap}
.error{color:#ac263a;font-size:13px;white-space:pre-wrap}.ok{color:#257447;font-size:13px;white-space:pre-wrap}
@media(max-width:600px){.card{align-items:start;flex-direction:column}.dialog-content{padding:15px}}
</style></head>
<body><header><a href="/">← 인재 Pool 관리</a><h1>핵심 인재 접촉 점검</h1></header>
<main><h2>6개월 접촉 주기</h2>
<p>최근 접촉 이력이 있는 핵심 인재 중 6개월 이상 경과한 대상자를 표시합니다. 알림이 발송되어도 인재에게 메일이 자동 발송되지는 않습니다. 담당자가 초안을 수정하고 승인 코드를 입력해야 발송됩니다.</p>
<section class="panel"><h2>근황 확인 대상</h2><div id="status" class="sub">불러오는 중…</div><div id="items"></div></section></main>
<dialog id="composer"><div class="dialog-content">
<div style="display:flex;justify-content:space-between;align-items:center"><h2>근황 확인 메일 작성</h2><button id="close" type="button">닫기 ×</button></div>
<p>수신자는 인재의 등록 이메일로 고정됩니다. 제목과 본문을 자유롭게 수정할 수 있습니다.</p>
<form id="form">
<label>받는 사람<input id="recipient" type="email" readonly></label>
<label>제목<input id="subject" maxlength="300" required></label>
<label>본문<textarea id="body" maxlength="15000" required></textarea></label>
<label>발송 승인 코드<input id="approval" type="password" autocomplete="off" required placeholder="사내 관리자가 설정한 승인 코드"></label>
<p id="sendStatus" class="sub"></p>
<div class="actions"><button id="cancel" type="button">취소</button><button class="primary" type="submit" id="send">최종 확인 후 메일 발송</button></div>
</form></div></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id);
let current=null,busy=false,attempted=false;
async function api(url,options={}){
 const res=await fetch(url,{credentials:"same-origin",...options});
 const data=await res.json();
 if(!res.ok)throw Error(data.detail||"서버 요청 오류 "+res.status);
 return data;
}
async function openDraft(id){
 try{
 const x=await api("/api/followups/"+id+"/draft");
 current=x;busy=false;attempted=false;
 $("recipient").value=x.recipient;$("subject").value=x.subject;$("body").value=x.body;$("approval").value="";
 $("sendStatus").textContent="";$("send").disabled=false;
 $("composer").showModal();
 }catch(e){alert(e.message)}
}
async function refresh(){
 try{
 const {items,enabled}=await api("/api/followups");
 $("status").textContent=(enabled?"자동 알림 사용 중":"자동 알림 미설정")+" · 6개월 경과 "+items.length+"명";
 $("items").replaceChildren();
 if(!items.length){const p=document.createElement("p");p.textContent="현재 접촉 주기가 지난 핵심 인재가 없습니다."; $("items").append(p)}
 for(const x of items){
 const card=document.createElement("div");card.className="card";
 const info=document.createElement("div");
 const name=document.createElement("strong");name.textContent=x.name+" · "+x.org;
 const sub=document.createElement("div");sub.className="sub";sub.textContent="최근 접촉 "+x.last_contact+" / 점검 기준일 "+x.due_on+" / 알림 "+x.notice_state;
 info.append(name,sub);
 const b=document.createElement("button");b.textContent="메일 발송하기";b.onclick=()=>openDraft(x.id);
 card.append(info,b);$("items").append(card)
 }
 }catch(e){$("status").textContent="조회 오류: "+e.message}
}
function close(){if(!busy)$("composer").close()}
$("close").onclick=close;$("cancel").onclick=close;
$("composer").addEventListener("cancel",e=>{if(busy)e.preventDefault()});
$("form").onsubmit=async e=>{
 e.preventDefault();if(!current||busy||attempted)return;
 if(!confirm(current.name+"님에게 메일 API 발송을 요청하시겠습니까?\n발송 요청이 수락되면 접촉 이력에 기록됩니다."))return;
 busy=true;attempted=true;$("send").disabled=true;$("sendStatus").className="sub";$("sendStatus").textContent="메일 API 요청 중…";
 try{
 const answer=await api("/api/followups/"+current.talent_id+"/send",
 {method:"POST",headers:{"Content-Type":"application/json","X-Internal-Action":"1"},
 body:JSON.stringify({recipient:$("recipient").value,subject:$("subject").value,body:$("body").value,
 approval_code:$("approval").value,request_id:current.request_id})});
 $("sendStatus").className="ok";$("sendStatus").textContent=answer.message+" / 접촉 이력 자동 등록됨";
 await refresh();
 }catch(err){
 $("sendStatus").className="error";$("sendStatus").textContent=err.message+"\n전송 여부를 사내 메일함에서 확인하고 새 작성창을 열어주세요.";
 }finally{busy=false;$("approval").value=""}
};
refresh().then(()=>{const id=Number(new URLSearchParams(location.search).get("talent_id"));if(Number.isSafeInteger(id)&&id>0)openDraft(id)});
</script></body></html>
