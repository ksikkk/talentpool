<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인재 Pool 관리</title>
<style>
:root{font:15px/1.55 system-ui,"Malgun Gothic",sans-serif;color:#1c2b42;background:#f5f7fb}*{box-sizing:border-box}
body{margin:0}header{background:#fff;border-bottom:1px solid #e5eaf2;padding:20px max(22px,calc((100vw - 1350px)/2));display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0;font-weight:760;letter-spacing:-.5px}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0 0 12px}
main{max-width:1350px;margin:0 auto;padding:26px 22px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8cbbff;outline-offset:2px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:22px}
.metric-group{background:#fff;border:1px solid #e4eaf2;border-radius:17px;padding:18px;box-shadow:0 3px 16px #102d4a0a;min-width:0}
.metric-group h2{font-size:16px;margin:0 0 12px}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.metric-grid .metric{padding:11px 13px;border-radius:12px;box-shadow:none}
.metric-grid .metric.main{grid-column:1/-1;background:#173a68;color:#fff;border-color:#173a68}
.metric-grid .metric.main .num{color:#fff;font-size:31px}
.metric-grid .metric.main .sub{color:#b9d3f4}
.metric-grid .metric.main.on{outline:2px solid #74b6ff;outline-offset:2px}
.metric-grid .metric .num{font-size:23px}
.metric-grid .metric .sub{font-size:11px}
.metric-total{margin-bottom:14px;padding:13px 18px;display:flex!important;align-items:center;justify-content:space-between;gap:12px}
.metric-total .num{font-size:27px;margin:0}
@media(max-width:900px){.metrics{grid-template-columns:1fr}}
@media(max-width:520px){.metric-group{padding:13px}.metric-grid{gap:7px}.metric-grid .metric{padding:10px}.metric-grid .metric .num{font-size:20px}.metric-grid .metric .sub{display:none}.metric-grid .metric.main .sub{display:block}}
.metric{display:block;text-align:left;background:#fff;border:1px solid #e3e9f1;box-shadow:0 4px 16px #142b4910;border-radius:17px;padding:19px 21px;color:#253854;transition:.15s}
.metric:hover{transform:translateY(-2px);border-color:#7ea9da}.metric.on{border-color:#376aa8;background:#eef5ff;box-shadow:0 0 0 1px #376aa8}
.metric .num{display:block;font-size:29px;font-weight:770;margin-top:5px;color:#122944}.metric .sub{font-size:12px;color:#71829a}
.toolbar{display:flex;gap:12px;margin-bottom:15px;align-items:center}.toolbar input{flex:1}.toolbar button{background:#fff}
input,select,textarea{border:1px solid #dbe2ed;border-radius:10px;background:white;padding:11px;color:#21354f;min-width:0}
button.primary{background:#205595;color:#fff;border:0;border-radius:10px;padding:11px 17px;font-weight:650}
button.ghost{background:white;border:1px solid #d9e1ed;border-radius:10px;padding:10px 14px;color:#365579}
.workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.workspace.expanded{grid-template-columns:minmax(320px,1fr) minmax(440px,1.2fr)}
.workspace:not(.expanded) #detailPanel{display:none}
.workspace:not(.expanded) .list{max-height:none}
.field input:disabled,.field textarea:disabled,.field select:disabled{background:#f7f9fc;color:#384b64;border-color:#e8edf4;opacity:1}
.field input:disabled,.field textarea:disabled{cursor:default}
.field textarea:disabled{resize:none}
.domains{margin:0 0 23px;padding:20px 22px;background:white;border:1px solid #e4eaf2;border-radius:17px;box-shadow:0 3px 15px #102d4a09}
.domainhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.domainlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px}
.domaincard{background:#f7f9fd;border:1px solid #e6edf6;border-radius:12px;text-align:left;padding:12px 13px;color:#28415f}
.domaincard:hover,.domaincard.on{border-color:#3e73b2;background:#eaf3ff}
.domain-all{background:#173a68!important;color:white!important;border-color:#173a68!important;box-shadow:0 6px 16px #173a6830}
.domain-all .domainline{font-size:15px!important}
.domain-all.on{outline:2px solid #90bbf0;outline-offset:2px}
.domaincard:not(.domain-all){background:#f3f8ff}
.domaincard:not(.domain-all).on{background:#e4efff;border-color:#3976b6}
.domaincard:not(.domain-all) .domaincount{font-size:17px;font-weight:800}
.domaincard:hover{transform:translateY(-1px)}
.domaincard .bar span{display:block;height:100%;background:#477db8}
.domaincard .domainline{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:13px}
.domaincard .domaincount{color:#3a669b;font-variant-numeric:tabular-nums}
.person .listline{font-size:13px;color:#657890;margin-top:6px;overflow-wrap:anywhere;display:grid;grid-template-columns:66px minmax(0,1fr);align-items:start;gap:5px}
.person .top{margin-bottom:13px;padding-bottom:12px;border-bottom:1px solid #edf2f8}
.person .top strong{font-size:17px;letter-spacing:-.25px}
.person .listline:nth-last-child(1){color:#336696}

.person .listline b{font-weight:650;color:#405873}
.editactions{display:flex;gap:8px;align-items:center}

.panel{background:white;border:1px solid #e4eaf2;border-radius:17px;box-shadow:0 3px 17px #102d4a0c;overflow:hidden}
.panelhead{padding:19px 21px;border-bottom:1px solid #edf1f6;display:flex;align-items:center;justify-content:space-between}
.caption{color:#72849b;font-size:12px}.list{max-height:73vh;overflow:auto}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px;padding:16px;background:#f8fafd;align-content:start}
.workspace.expanded .list{grid-template-columns:1fr}
.person{width:100%;padding:19px 20px;background:white;border:1px solid #dfe7f1;border-radius:14px;text-align:left;color:inherit;display:block;box-shadow:0 3px 10px #142d4b0b;min-height:172px;transition:box-shadow .15s,border-color .15s,transform .15s}
.person:hover{transform:translateY(-2px);box-shadow:0 7px 18px #142d4b14;border-color:#93b5df}
.person.active{background:#eff6ff;border-color:#3776be;box-shadow:0 0 0 1px #3776be}.person .top{display:flex;gap:10px;align-items:start;justify-content:space-between}.person strong{font-size:16px}
.person .research{font-size:12px;color:#2f68a1;font-weight:680;margin-bottom:7px}
.person .secondary{font-size:13px;color:#6f8096;margin-top:5px}.pill{font-size:11px;padding:4px 9px;border-radius:30px;background:#e8f0fc;color:#2c5b99;white-space:nowrap;font-weight:680}
.pill.focus{background:#e5ebff;color:#3e47a1}.pill.muted{background:#f1f4f8;color:#718197}
.detail{padding:22px}.hidden{display:none!important}.placeholder{padding:60px 22px;color:#8291a4;text-align:center}
.detailhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.profilegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;color:#657992;font-size:12px;font-weight:650;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%}.field textarea{resize:vertical;min-height:80px}
.section{border-top:1px solid #edf1f6;margin-top:24px;padding-top:21px}
summary{cursor:pointer;color:#2b5e9d;font-weight:600;margin-bottom:12px}
.note{font-size:12px;color:#7b8797;margin:8px 0}.actions{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.message{font-size:13px;color:#257347}.message.error{color:#b23443}
.contact{padding:14px;border:1px solid #e8edf4;border-radius:12px;margin-top:10px}.contact p{margin:5px 0 0;white-space:pre-wrap;color:#556b83}
.sourceslist{white-space:pre-wrap;word-break:break-all;min-height:76px}.empty{padding:30px;text-align:center;color:#7a8ca1}
@media(max-width:950px){.workspace.expanded{grid-template-columns:1fr}.list{max-height:350px}}
@media(max-width:560px){main{padding:16px 12px}.metrics{gap:8px}.metric{padding:12px}.metric .num{font-size:24px}.profilegrid{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}header{padding:16px}}

#details:not(.is-editing) .display-control input,
#details:not(.is-editing) .display-control textarea,
#details:not(.is-editing) .display-control select{display:none}
#details.is-editing .display-control .plain-value{display:none}
.plain-value{font-weight:520;color:#1c2b42;white-space:pre-wrap;overflow-wrap:anywhere;min-height:27px;padding:5px 0}
.profile-buttons{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
button.danger{background:#fff2f2;border:1px solid #f0c9c9;color:#a22929;border-radius:9px;padding:9px 13px}
.field label{margin-bottom:2px}

.manage-panel{background:#f5f8fd;border:1px solid #d8e4f1;border-radius:13px;padding:16px;margin:12px 0 18px}
.manage-panel .profilegrid{margin-top:10px}
.history-modal{position:fixed;inset:0;z-index:80;background:#12233c9b;display:flex;align-items:center;justify-content:center;padding:16px}
.history-card{width:min(640px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 18px 75px #0003}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
@media(max-width:600px){.history-card{max-height:96vh;padding:16px}.profile-buttons{gap:5px}.profile-buttons button{padding:7px 10px}}
/* Compact, mutually linked dashboard */
.metric-group{padding:12px 14px;border-radius:13px}
.metric-group h2{font-size:14px;margin-bottom:9px}
.metrics{gap:10px;margin-bottom:14px}
.metric-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.metric-grid .metric{padding:7px 10px;border-radius:9px;min-height:53px}
.metric-grid .metric.main{grid-column:auto;min-height:53px}
.metric-grid .metric.main .num,.metric-grid .metric .num{font-size:19px;line-height:1.1;margin-top:2px}
.metric-grid .metric .sub{display:none!important}
.metric-grid .metric span:first-child{font-size:12px}
.metric-total{margin-bottom:9px;padding:8px 13px;border-radius:10px;min-height:45px}
.metric-total .num{font-size:21px}
.metric-grid .metric.on{outline:2px solid #8db3e5;outline-offset:1px}
.metric-grid .metric.main.on{outline:2px solid #74b6ff}
@media(max-width:520px){.metric-group{padding:10px}.metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.metric-grid .metric{padding:7px}.metric-grid .metric.main .num,.metric-grid .metric .num{font-size:18px}}
</style></head><body>
<header><h1>인재 Pool 관리</h1><nav style="display:flex;gap:18px;flex-wrap:wrap"><a href="/mail" style="color:#205595;text-decoration:none;font-weight:750">✉ 메일쓰기</a><a href="/followups" style="color:#285f9e;text-decoration:none;font-weight:650">핵심 인재 접촉 점검</a><a href="/duplicate-reviews" style="color:#a2641b;text-decoration:none;font-weight:650">중복 후보 검토</a></nav></header>
<main>
<button class="metric metric-total on" data-metric="all"><span>전체 등록 인재</span><span class="num" id="total">—</span></button>
<div class="metrics">
<section class="metric-group" aria-label="관리 상태별 현황">
<h2>관리 상태별 현황</h2><div class="metric-grid">
<button class="metric" data-filter-type="status" data-filter-value=""><span>전체</span><span class="num" id="status-all">—</span></button>
<button class="metric main" data-filter-type="status" data-filter-value="접촉중"><span>접촉중</span><span class="num" id="status-contact">—</span><span class="sub">현재 접촉 진행 인재</span></button>
<button class="metric" data-filter-type="status" data-filter-value="검토중"><span>검토중</span><span class="num" id="status-review">—</span></button>
<button class="metric" data-filter-type="status" data-filter-value="보류"><span>보류</span><span class="num" id="status-hold">—</span></button>
<button class="metric" data-filter-type="status" data-filter-value="종료"><span>종료</span><span class="num" id="status-closed">—</span></button>
</div></section>
<section class="metric-group" aria-label="관심도별 현황">
<h2>관심도별 현황</h2><div class="metric-grid">
<button class="metric" data-filter-type="priority" data-filter-value=""><span>전체</span><span class="num" id="priority-all">—</span></button>
<button class="metric main" data-filter-type="priority" data-filter-value="핵심"><span>핵심</span><span class="num" id="priority-core">—</span><span class="sub">핵심 관심 인재</span></button>
<button class="metric" data-filter-type="priority" data-filter-value="높음"><span>높음</span><span class="num" id="priority-high">—</span></button>
<button class="metric" data-filter-type="priority" data-filter-value="보통"><span>보통</span><span class="num" id="priority-normal">—</span></button>
<button class="metric" data-filter-type="priority" data-filter-value="낮음"><span>낮음</span><span class="num" id="priority-low">—</span></button>
<button class="metric" data-filter-type="priority" data-filter-value="미분류"><span>미분류</span><span class="num" id="priority-none">—</span></button>
</div></section></div>
<section class="domains"><div class="domainhead"><h2>발굴 요청 분야별 현황</h2><span class="caption" id="domainCaption">검색 질문에서 요청한 분야를 기준으로 집계</span></div><div class="domainlist" id="domainList"></div></section>
<div class="toolbar"><input id="search" placeholder="연구 분야 · 성명 · 소속 검색"><button id="reset" class="ghost">검색 초기화</button></div>
<div class="workspace" id="workspace">
<section class="panel"><div class="panelhead"><h2>인재 목록</h2><span class="caption" id="counter"></span></div><div id="list" class="list"></div></section>
<section class="panel" id="detailPanel"><div class="panelhead"><h2>인재 상세 및 관리</h2><div class="profile-buttons" id="profileButtons"><button id="closeDetail" class="ghost hidden">닫기 ×</button></div></div>
<div id="details" class="detail"></div></section>
</div></main>
<script>
"use strict";
const $=id=>document.getElementById(id),make=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
let people=[],selected=null,statusFilter="",priorityFilter="",domainFilter="",editing=false;
async function api(path,opts){const r=await fetch(path,{credentials:"same-origin",...opts});if(!r.ok){let detail="";try{detail=(await r.json()).detail||""}catch{}throw Error(detail||"서버 오류 "+r.status)}return r.json()}
function field(label,kind,value,options=[]){const box=make("div","field"),lab=make("label","",label),ctrl=make(kind);if(kind==="select")for(const o of options){const opt=make("option","",o);ctrl.append(opt)}if(kind==="textarea")ctrl.rows=3;ctrl.value=value??"";box.append(lab,ctrl);return {box,ctrl}}
function fieldsOf(p){
 const fields=p.classification?[p.classification]:(p.requested_fields||[]).filter(Boolean);
 return [...new Set(fields.length?fields:["미분류"])];
}
function matchQuery(p){
 const term=$("search").value.trim().toLowerCase();
 return !term||[p.domain,p.name,p.org,p.headline].some(v=>(v||"").toLowerCase().includes(term));
}
function matchPerson(p,skip=""){
 return matchQuery(p)
   &&(skip==="status"||!statusFilter||p.status===statusFilter)
   &&(skip==="priority"||!priorityFilter||p.priority===priorityFilter)
   &&(skip==="domain"||!domainFilter||fieldsOf(p).includes(domainFilter));
}
function filteredPeople(skip=""){return people.filter(p=>matchPerson(p,skip))}
function syncButtons(){
 document.querySelectorAll("[data-filter-type]").forEach(button=>{
   const key=button.dataset.filterType,value=button.dataset.filterValue;
   button.classList.toggle("on",(key==="status"?statusFilter:priorityFilter)===value);
   button.setAttribute("aria-pressed",String((key==="status"?statusFilter:priorityFilter)===value));
 });
 const total=document.querySelector(".metric-total");
 total.classList.toggle("on",!statusFilter&&!priorityFilter&&!domainFilter);
}
function stats(){
 $("total").textContent=people.length;
 const statuses=filteredPeople("status"),priorities=filteredPeople("priority");
 const groups=[["status-all",statuses.length],["priority-all",priorities.length],
 ["status-contact",statuses.filter(p=>p.status==="접촉중").length],
 ["status-review",statuses.filter(p=>p.status==="검토중").length],
 ["status-hold",statuses.filter(p=>p.status==="보류").length],
 ["status-closed",statuses.filter(p=>p.status==="종료").length],
 ["priority-core",priorities.filter(p=>p.priority==="핵심").length],
 ["priority-high",priorities.filter(p=>p.priority==="높음").length],
 ["priority-normal",priorities.filter(p=>p.priority==="보통").length],
 ["priority-low",priorities.filter(p=>p.priority==="낮음").length],
 ["priority-none",priorities.filter(p=>p.priority==="미분류").length]];
 for(const [id,count] of groups)$(id).textContent=count;
 syncButtons();
}
function domains(){
 const subset=filteredPeople("domain"),counts=new Map();
 for(const p of subset)for(const field of fieldsOf(p))counts.set(field,(counts.get(field)||0)+1);
 const ordered=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ko"));
 const root=$("domainList");root.replaceChildren();
 const all=make("button","domaincard domain-all"+(!domainFilter?" on":""));
 all.append(make("div","domainline","전체 분야 · "+subset.length+"명"));
 all.setAttribute("aria-pressed",String(!domainFilter));
 all.onclick=()=>{domainFilter="";renderDashboard();clearIfFiltered();list()};
 root.append(all);
 // When a selected field has zero candidates after status/priority changes,
 // retain it as a visible active zero-count option until manually cleared.
 if(domainFilter&&!counts.has(domainFilter))ordered.push([domainFilter,0]);
 for(const [name,count] of ordered){
 const button=make("button","domaincard"+(domainFilter===name?" on":"")),line=make("div","domainline");
 line.append(make("span","",name),make("span","domaincount",count+"명"));
 button.append(line);button.setAttribute("aria-pressed",String(domainFilter===name));
 button.onclick=()=>{domainFilter=domainFilter===name?"":name;renderDashboard();clearIfFiltered();list()};
 root.append(button)
 }
 $("domainCaption").textContent=ordered.length+"개 요청 분야 · 선택한 관리 상태·관심도를 반영";
}
function renderDashboard(){stats();domains()}
function clearIfFiltered(){
 if(selected&&!filteredPeople().some(p=>p.id===selected))clearDetail();
}
function list(){const filtered=filteredPeople();
$("counter").textContent=filtered.length+"명";const root=$("list");root.replaceChildren();if(!filtered.length){root.append(make("div","empty","해당 인재가 없습니다."));return}
for(const p of filtered){const b=make("button","person"+(selected===p.id?" active":""));b.type="button";
const top=make("div","top");top.append(make("strong","",p.name||"성명 미등록"));
const level=["핵심","높음","보통","낮음","미분류"].includes(p.priority)?p.priority:"미분류";
const badge=make("span","pill "+(level==="핵심"?"focus":level==="미분류"?"muted":""),level);
top.append(badge);b.append(top);
const trust=make("div","caption","공개 근거: "+(p.source_quality?.grade||"추가 검증 필요"));
trust.style.cssText="margin:-6px 0 10px;font-weight:600;color:#426a98";
b.append(trust);
for(const [label,value] of [["소속",p.org],["직책",p.headline],["연구분야",p.domain]]){
 const row=make("div","listline");row.append(make("b","",label),make("span","",value||"미등록"));b.append(row)
}
b.onclick=e=>{e.stopPropagation();choose(p.id)};root.append(b)}}
function clearDetail(){document.querySelectorAll(".history-modal").forEach(x=>x.remove());selected=null;editing=false;$("details").replaceChildren();$("workspace").classList.remove("expanded");$("closeDetail").classList.add("hidden");list()}
async function choose(id,force=false){if(selected===id&&!force){clearDetail();return}document.querySelectorAll(".history-modal").forEach(x=>x.remove());selected=id;editing=false;list();$("workspace").classList.add("expanded");$("closeDetail").classList.remove("hidden");const root=$("details");root.replaceChildren();
try{const t=await api("/api/talents/"+id);if(selected!==id)return;
const head=make("div","detailhead");head.append(make("h2","",t.name));root.append(head);
if(t.last_public_refresh){const line=make("div","caption","최종 사내 공개정보 자동 반영: "+t.last_public_refresh.slice(0,10));line.style.marginBottom="12px";root.append(line)}
const evidence=make("div","evidenceSummary");
evidence.style.cssText="background:#f2f7fd;border:1px solid #dce8f6;border-radius:11px;padding:12px;margin-bottom:18px;font-size:13px";
evidence.append(make("strong","","공개 근거: "+(t.source_quality?.grade||"추가 검증 필요")));
const desc=make("div","note",t.source_quality?.note||"도메인 유형 기반 참고 정보입니다. 원문 확인이 필요합니다.");evidence.append(desc);
const kinds=make("div","note",(t.source_quality?.sources||[]).map(x=>x.kind).join(" · "));evidence.append(kinds);root.append(evidence);
const grid=make("div","profilegrid"),input={};
const editFields=[];
function profileField(f,value){f.box.classList.add("display-control");const view=make("div","plain-value",value||"—");f.box.append(view);editFields.push({ctrl:f.ctrl,view});return f}

for(const [key,label,kind] of [["name","성명","input"],["org","소속","input"],["headline","직책","input"],["classification","분류","input"],["domain","연구 분야","input"],["summary","연구/경력 요약","textarea"],["why_fit","인재 적합성","textarea"],["email","이메일 주소","input"]]){
const f=profileField(field(label,kind,t[key]),t[key]);if(kind==="textarea")f.box.classList.add("full");if(key==="email")f.ctrl.type="email";grid.append(f.box);input[key]=f.ctrl}
const src=make("details","section");const summary=make("summary","","출처 보기");src.append(summary);
const urls=field("공개 출처 URL (한 줄에 하나씩)","textarea",(t.sources||[]).join("\n"));urls.box.classList.add("full");urls.ctrl.classList.add("sourceslist");profileField(urls,(t.sources||[]).join("\n"));src.append(urls.box);
const note=make("p","note","수정한 공개 프로필 정보는 이후 메일 재수신 시 유지됩니다.");src.append(note);root.append(grid,src);
const section=make("div","history-modal hidden");
const manageCard=make("div","history-card"),manageHead=make("div","history-header");
manageHead.append(make("h3","",t.name+" · 관리 현황"));
const manageClose=make("button","ghost","닫기 ×");
manageHead.append(manageClose);manageCard.append(manageHead);
section.append(manageCard);document.body.append(section);
const closeManage=()=>section.classList.add("hidden");
manageClose.onclick=closeManage;
section.onclick=e=>{if(e.target===section)closeManage()};
const internal=make("div","profilegrid");
const status=field("관리 상태","select",["검토중","접촉중","보류","종료"].includes(t.status)?t.status:"검토중",["검토중","접촉중","보류","종료"]);
const priority=field("관심도","select",t.priority,["미분류","핵심","높음","보통","낮음"]);
const notes=field("내부 관리 메모","textarea",t.internal_notes);notes.box.classList.add("full");internal.append(status.box,priority.box,notes.box);manageCard.append(internal);
const actions=make("div","profile-buttons"),edit=make("button","ghost","수정"),save=make("button","primary","수정 완료"),cancelEdit=make("button","ghost","취소"),del=make("button","danger","삭제"),message=make("span","message");
const editControls=[...Object.values(input),urls.ctrl];
function editMode(on){editing=on;root.classList.toggle("is-editing",on);editControls.forEach(c=>c.disabled=!on);edit.classList.toggle("hidden",on);save.classList.toggle("hidden",!on);cancelEdit.classList.toggle("hidden",!on);del.classList.toggle("hidden",on);summary.textContent=on?"출처 펼치기 · 수정":"출처 보기"}
edit.onclick=()=>editMode(true);cancelEdit.onclick=()=>choose(id,true);
const manageButton=make("button","ghost","관리 현황");
const historyButton=make("button","ghost","접촉 이력");
const directMailButton=make("button","ghost","메일쓰기");directMailButton.onclick=()=>{location.href="/mail?talent_id="+encodeURIComponent(id)};
manageButton.onclick=()=>{section.classList.remove("hidden");};
const manageSave=make("button","primary","관리 정보 저장"),manageMessage=make("span","message");
manageSave.onclick=async()=>{manageSave.disabled=true;try{
 await api("/api/talents/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","X-Internal-Action":"1"},body:JSON.stringify({status:status.ctrl.value,priority:priority.ctrl.value,internal_notes:notes.ctrl.value})});
 manageMessage.className="message";manageMessage.textContent="저장했습니다.";section.classList.add("hidden");await loadList(false);
}catch(e){manageMessage.className="message error";manageMessage.textContent="저장 실패: "+e.message}finally{manageSave.disabled=false}};
const manageFooter=make("div","actions");manageFooter.append(manageSave,manageMessage);manageCard.append(manageFooter);
actions.append(manageButton,historyButton,directMailButton,edit,save,cancelEdit,del);
$("profileButtons").replaceChildren(actions,$("closeDetail"));root.append(message);editMode(false);
del.onclick=async()=>{if(!confirm(t.name+" 인재를 삭제하시겠습니까?\\n삭제하면 목록에서 제외되며 접촉 이력은 복구를 위해 보존됩니다."))return;
 del.disabled=true;try{await api("/api/talents/"+id,{method:"DELETE",headers:{"X-Internal-Action":"1"}});clearDetail();await loadList(false)}catch(e){message.textContent="삭제 실패: "+e.message;del.disabled=false}};

save.onclick=async()=>{save.disabled=true;message.textContent="";try{
const changes={};for(const [key,ctrl] of Object.entries(input)){if(ctrl.value.trim()!==(t[key]||""))changes[key]=ctrl.value.trim()}
const newSources=urls.ctrl.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
if(JSON.stringify(newSources)!==JSON.stringify(t.sources||[]))changes.sources=newSources;
if(!Object.keys(changes).length){message.textContent="변경된 내용이 없습니다.";editMode(false);save.disabled=false;return}
const res=await api("/api/talents/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","X-Internal-Action":"1"},body:JSON.stringify(changes)});
message.className="message";message.textContent="저장했습니다.";await loadList(false);head.querySelector("h2").textContent=res.name;for(const f of editFields)f.view.textContent=f.ctrl.value||"—";editMode(false)
}catch(e){message.className="message error";message.textContent="저장 실패: "+e.message}finally{save.disabled=false}};
const historySection=make("div","history-modal hidden");
const historyCard=make("div","history-card"),historyHead=make("div","history-header");
historyHead.append(make("h3","",t.name+" · 접촉 이력"));
const historyClose=make("button","ghost","닫기 ×");historyHead.append(historyClose);
historyCard.append(historyHead);historySection.append(historyCard);document.body.append(historySection);
const closeHistory=()=>historySection.classList.add("hidden");
historyClose.onclick=closeHistory;historySection.onclick=e=>{if(e.target===historySection)closeHistory()};
historyButton.onclick=()=>historySection.classList.remove("hidden");
const history=make("div");const add=make("button","ghost","＋ 접촉 이력 추가");historyCard.append(add,history);
const entry=make("div","profilegrid hidden"),day=field("접촉일","input",""),channel=field("접촉 방식","select","이메일",["이메일","전화","미팅","기타"]),subject=field("주제","input",""),memo=field("내용","textarea","");day.ctrl.type="date";day.ctrl.value=new Date().toLocaleDateString("sv-SE");memo.box.classList.add("full");entry.append(day.box,channel.box,subject.box,memo.box);
const addActions=make("div","actions"),submit=make("button","primary","이력 저장"),cancel=make("button","ghost","취소"),notice=make("span","message");addActions.append(submit,cancel,notice);entry.append(addActions);historyCard.insertBefore(entry,history);
add.onclick=()=>{entry.classList.remove("hidden");add.classList.add("hidden")};cancel.onclick=()=>{entry.classList.add("hidden");add.classList.remove("hidden")};
async function loadHistory(){const d=await api("/api/talents/"+id+"/contacts");if(selected!==id)return;history.replaceChildren();if(!d.items.length)history.append(make("p","note","접촉 이력이 없습니다."));for(const c of d.items){const item=make("div","contact");item.append(make("strong","",c.contact_at+" · "+c.channel+" · "+c.subject),make("p","",c.memo||""));history.append(item)}}
submit.onclick=async()=>{submit.disabled=true;notice.textContent="";try{await api("/api/talents/"+id+"/contacts",{method:"POST",headers:{"Content-Type":"application/json","X-Internal-Action":"1"},body:JSON.stringify({contact_at:day.ctrl.value,channel:channel.ctrl.value,subject:subject.ctrl.value,memo:memo.ctrl.value})});await loadHistory();if(status.ctrl.value==="검토중"){status.ctrl.value="접촉중"}await loadList(false);entry.classList.add("hidden");add.classList.remove("hidden");subject.ctrl.value="";memo.ctrl.value=""}catch(e){notice.className="message error";notice.textContent=e.message}finally{submit.disabled=false}};
await loadHistory();
}catch(e){root.replaceChildren(make("p","message error","상세 정보를 불러오지 못했습니다."))}}
async function loadList(reset=true){try{const d=await api("/api/talents?limit=500");people=d.items;renderDashboard();if(reset&&selected&&!people.some(x=>x.id===selected))clearDetail();clearIfFiltered();list()}catch(e){$("list").replaceChildren(make("div","empty","목록 조회에 실패했습니다."))}}
$("closeDetail").onclick=clearDetail;
$("search").oninput=()=>{renderDashboard();clearIfFiltered();list()};
$("reset").onclick=()=>{
 $("search").value="";statusFilter="";priorityFilter="";domainFilter="";
 renderDashboard();clearDetail();list()
};
document.querySelector(".metric-total").onclick=()=>{
 statusFilter="";priorityFilter="";domainFilter="";$("search").value="";
 renderDashboard();clearDetail();list()
};
document.querySelectorAll("[data-filter-type]").forEach(button=>button.onclick=()=>{
 const kind=button.dataset.filterType,value=button.dataset.filterValue;
 if(kind==="status")statusFilter=statusFilter===value?"":value;
 else priorityFilter=priorityFilter===value?"":value;
 renderDashboard();clearIfFiltered();list()
});
document.addEventListener("click",e=>{if(selected&&!e.target.closest(".person,.detail,.panelhead,.metric,.toolbar,.domains,.history-modal"))clearDetail()});
loadList();
</script></body></html>
