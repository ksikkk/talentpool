<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>인재 Pool 메일쓰기</title>
<style>
:root{font:15px/1.6 system-ui,"Malgun Gothic",sans-serif;color:#1b304b;background:#f5f8fc}*{box-sizing:border-box}
body{margin:0}header{padding:18px max(20px,calc((100vw - 1150px)/2));display:flex;align-items:center;gap:16px;background:white;border-bottom:1px solid #dae4f1}header h1{margin:0;font-size:21px}
main{max-width:1150px;margin:auto;padding:24px 20px}
a{color:#285e9d;text-decoration:none}
.card{background:white;border:1px solid #dce6f2;border-radius:16px;padding:21px;margin-bottom:17px;box-shadow:0 3px 18px #13294709}
h2{font-size:17px;margin:0 0 12px}
p,.note{color:#657a94;font-size:13px}
label{display:block;font-size:13px;color:#455e7e;font-weight:650;margin:14px 0 5px}
input,textarea,button{font:inherit}
input,textarea{width:100%;border:1px solid #cbd9e9;border-radius:9px;padding:10px;color:#1b304b;background:#fff;min-width:0}
textarea{min-height:180px;resize:vertical}
button{background:#fff;border:1px solid #d2dfed;color:#275e9a;border-radius:9px;padding:10px 15px;cursor:pointer}
button.primary{background:#235b9c;color:white;border-color:#235b9c}
button:disabled{opacity:.55;cursor:not-allowed}
.results{max-height:300px;overflow:auto;border:1px solid #e2e9f3;border-radius:12px;background:#f8fafd;margin-top:10px}
.result{display:flex;width:100%;justify-content:space-between;gap:10px;text-align:left;background:#fff;border:0;border-bottom:1px solid #e4ebf5;border-radius:0;padding:12px 14px}
.result:hover,.result:focus{background:#edf5ff}
.result strong{font-size:14px}.result small{display:block;color:#657c94;font-size:12px;overflow-wrap:anywhere}
.tag{font-size:11px;color:#3b699c;white-space:nowrap;background:#e6f0ff;border-radius:9px;padding:3px 7px;height:max-content}
.selected{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#eef6ff;padding:13px;border:1px solid #bdd5f3;border-radius:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:19px;flex-wrap:wrap}
.hidden{display:none!important}
.error{color:#b4263d;font-size:13px;white-space:pre-wrap}
.success{color:#167349;font-size:13px;white-space:pre-wrap}
@media(max-width:650px){.two{grid-template-columns:1fr}.card{padding:15px}main{padding:14px 12px}.selected{align-items:start;flex-direction:column}}
</style></head><body>
<header><a href="/">← 인재 Pool 관리</a><h1>메일쓰기</h1></header>
<main>
<section class="card">
<h2>1. 인재 Pool에서 수신자 검색</h2>
<p>성명, 소속, 직책 또는 연구 분야로 찾으세요. 등록 인재 한 명을 선택하여 개별 메일을 발송합니다.</p>
<input id="search" placeholder="인재 이름 · 소속 · 연구 분야" autocomplete="off" maxlength="100" aria-label="인재 검색어"/>
<div class="results" id="results" aria-live="polite"><div class="note" style="padding:15px">검색어를 입력하면 후보 목록이 표시됩니다.</div></div>
</section>
<section class="card">
<h2>2. 메일 작성</h2>
<div id="empty" class="note">위에서 수신할 인재를 선택하세요.</div>
<div id="editor" class="hidden">
<div class="selected"><div><strong id="personName"></strong><div id="personDetail" class="note"></div></div><button type="button" id="change">대상 다시 선택</button></div>
<div class="two"><div><label for="sender">보내는 사람</label><input id="sender" readonly placeholder="설정된 발신 주소"/></div>
<div><label for="recipient">받는 사람 (이번 메일에만 적용)</label><input id="recipient" type="email" maxlength="254" required placeholder="name@university.edu"/></div></div>
<p class="note">수신자 주소를 변경해도 인재 DB의 이메일은 변경되지 않습니다. 실제 발송 주소는 접촉 이력에 남습니다.</p>
<label for="subject">제목</label><input id="subject" maxlength="300" required/>
<label for="body">본문</label><textarea id="body" maxlength="15000" required></textarea>
<label for="approval">발송 승인 코드</label><input id="approval" type="password" autocomplete="off" placeholder="관리자가 설정한 승인 코드" required/>
<p id="notice" class="note">메일을 보내면 API 요청 성공 시 접촉 이력이 자동 등록됩니다. 실제 배달 여부는 발신함에서 확인하세요.</p>
<div class="actions"><button type="button" id="reset">초안 초기화</button><button type="button" class="primary" id="send">최종 확인 후 메일 발송</button></div>
</div>
</section></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const headers={"Content-Type":"application/json","X-Internal-Action":"1"};
let selected=null,attempted=false,busy=false,searchSequence=0,searchTimer=null;
async function api(url,opts={}){
 const response=await fetch(url,{credentials:"same-origin",...opts});
 const data=await response.json();
 if(!response.ok)throw Error(data.detail||"서버 요청 실패 ("+response.status+")");
 return data;
}
function node(tag,content,cls=""){const el=document.createElement(tag);if(cls)el.className=cls;if(content!==undefined)el.textContent=content;return el}
async function search(){
 const query=$("search").value.trim();const mySeq=++searchSequence;const root=$("results");root.replaceChildren();
 if(!query){root.append(node("div","검색어를 입력하세요.","note"));return}
 root.append(node("div","검색 중…","note"));
 try{
 const {items}=await api("/api/mail/recipients?q="+encodeURIComponent(query));
 if(mySeq!==searchSequence)return;
 root.replaceChildren();
 if(!items.length){root.append(node("div","일치하는 인재가 없습니다.","note"));return}
 for(const p of items){
  const row=node("button",undefined,"result");row.type="button";
  const info=node("span");info.append(node("strong",p.name+" · "+p.org),node("small",[p.headline,p.domain,p.email||"이메일 미등록"].filter(Boolean).join(" · ")));
  row.append(info,node("span",p.status,"tag"));
  row.onclick=()=>selectPerson(p.id);
  root.append(row);
 }
 }catch(e){if(mySeq===searchSequence){root.replaceChildren(node("div","검색 실패: "+e.message,"error"))}}
}
$("search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(search,220)});
async function selectPerson(id){
 try{
 const data=await api("/api/mail/draft/"+id);
 selected=data;attempted=false;busy=false;
 $("personName").textContent=data.name+" · "+data.org;
 $("personDetail").textContent=[data.headline].filter(Boolean).join(" · ");
 $("sender").value=data.sender||"";
 $("recipient").value=data.recipient||"";
 $("subject").value=data.subject;
 $("body").value=data.body;
 $("approval").value="";
 $("notice").className="note";$("notice").textContent="입력한 수신자와 내용을 확인한 뒤 발송 승인 코드를 입력하세요.";
 $("send").disabled=false;
 $("empty").classList.add("hidden");$("editor").classList.remove("hidden");
 }catch(e){alert(e.message)}
}
$("change").onclick=()=>{$("search").focus();$("search").scrollIntoView({behavior:"smooth",block:"center"})};
$("reset").onclick=()=>{if(selected)selectPerson(selected.talent_id)};
$("send").onclick=async()=>{
 if(!selected||attempted||busy)return;
 const recipient=$("recipient").value.trim(),subject=$("subject").value.trim(),body=$("body").value,code=$("approval").value;
 if(!recipient||!$("recipient").checkValidity()||!subject||!body.trim()||!code){$("notice").className="error";$("notice").textContent="수신자·제목·본문·승인 코드를 확인하세요.";return}
 if(!confirm(selected.name+" ("+recipient+")에게 메일 발송을 요청하시겠습니까?\n수신자 주소 변경은 이번 메일에만 적용되고 인재 DB에는 저장되지 않습니다."))return;
 attempted=true;busy=true;$("send").disabled=true;
 $("notice").className="note";$("notice").textContent="Knox 메일 API 발송 요청 중…";
 try{
 const result=await api("/api/mail/send",{method:"POST",headers,
 body:JSON.stringify({talent_id:selected.talent_id,recipient,subject,body,approval_code:code,request_id:selected.request_id})});
 $("notice").className="success";$("notice").textContent=result.message+"\n해당 인재의 접촉 이력에 자동 등록했습니다.";
 }catch(e){
 $("notice").className="error";$("notice").textContent=e.message+"\n발송 여부가 불명확할 수 있습니다. 발신함 확인 후 새 작성창을 열어주세요.";
 }finally{busy=false;$("approval").value=""}
};
const urlId=Number(new URLSearchParams(location.search).get("talent_id"));
if(Number.isSafeInteger(urlId)&&urlId>0)selectPerson(urlId);
</script></body></html>
